# ============================================================
# droneImaging — Docker Compose（精简版 — 仅应用服务）
# ============================================================
# 基础设施（postgres、minio、milvus、etcd 等）已统一到
# phenomicsAgent/docker-compose.infra.yml，本文件仅保留应用服务。
#
# 启动应用:
#   docker compose up -d
# 查看日志:
#   docker compose logs -f drone-imaging
#
# 注意: 首次启动需确保 config.yaml 已配置（cp config.yaml.example config.yaml）
# ============================================================

services:
  drone-imaging:
    build:
      context: .
      dockerfile: Dockerfile
    image: drone-imaging:latest
    container_name: drone-imaging
    restart: unless-stopped
    ports:
      - "8005:8002"
    environment:
      # 客户端可访问的地址（生成瓦片/缩略图 URL 用）
      DRONE_PUBLIC_BASE_URL: ${DRONE_PUBLIC_BASE_URL:-http://localhost:8005}
      TZ: Asia/Shanghai
    volumes:
      # 挂载配置文件（覆盖镜像内的模板）
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - infra
      - phenomics-net

# ==========================================================
# Networks
# ==========================================================
networks:
  # 共享基础设施网络（由 docker-compose.infra.yml 创建）
  infra:
    external: true
    name: infra
  # phenomics 应用网络（供 phenomics-frontend nginx 反向代理访问）
  phenomics-net:
    external: true
    name: phenomics-net
