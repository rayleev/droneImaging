# Gitea Actions — 手动构建 Docker 镜像并部署
#
# 触发方式：手动触发（Gitea 仓库页面 → Actions → 选择本工作流 → Run workflow）
#
# 前提：
#   1. Gitea 启用 Actions（app.ini 中 [actions] ENABLED = true）
#   2. 仓库 Settings → Actions → 启用
#   3. drone-imaging-runner 已注册（已就绪）
#   4. 仓库 Secrets 配置：
#      - CONFIG_YAML    整个 config.yaml 文件的完整内容（含所有连接信息）
#      - SSH_HOST       服务器 IP
#      - SSH_USER       SSH 用户名
#      - SSH_KEY        SSH 私钥全文
#
# 产出：构建镜像 → 推送到 Gitea 容器仓库 → SSH 到服务器生成配置并重启

name: Build and Deploy

on:
  workflow_dispatch: {}   # 手动触发

env:
  REGISTRY: ${{ gitea.server }}
  IMAGE_NAME: ${{ gitea.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 通过 SSH 部署：用 CONFIG_YAML Secret 生成配置，拉取镜像并重启 ──
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: |
            CONFIG_YAML
          script: |
            set +H

            # ── 1. 用 Secret 生成 config.yaml ──
            mkdir -p ~/droneImaging
            cat > ~/droneImaging/config.yaml << 'CONFIGEOF'
            ${{ secrets.CONFIG_YAML }}
            CONFIGEOF

            echo "config.yaml generated successfully"

            # ── 2. 拉取最新镜像并重启容器 ──
            cd ~/droneImaging
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker rm -f drone-imaging 2>/dev/null
            docker run -d \
              --name drone-imaging \
              --restart unless-stopped \
              -p 8005:8002 \
              -e DRONE_PUBLIC_BASE_URL=http://${{ secrets.SSH_HOST }}:8005 \
              -v ~/droneImaging/config.yaml:/app/config.yaml:ro \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # ── 3. 验证启动 ──
            sleep 5
            docker ps --filter name=drone-imaging --format "status: {{.Status}}"
            curl -sf http://localhost:8005/health && echo " -> health OK" || echo " -> health FAILED"
