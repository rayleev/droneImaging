# Gitea Actions — 手动构建 Docker 镜像并部署
#
# 触发方式：手动触发（Gitea 仓库页面 → Actions → 选择本工作流 → Run workflow）
#
# 前提：
#   1. Gitea 启用 Actions（app.ini 中 [actions] ENABLED = true）
#   2. 仓库 Settings → Actions → 启用
#   3. gitea-runner 已注册（已就绪）
#   4. 仓库 Secrets 添加 SSH_HOST / SSH_USER / SSH_KEY（用于自动部署到服务器）
#
# 产出：构建镜像 → 推送到 Gitea 容器仓库 → SSH 到服务器拉取并重启

name: Build and Deploy

on:
  workflow_dispatch: {}   # 手动触发

env:
  # Gitea 内置容器仓库地址（自动可用，无需手动配置）
  REGISTRY: ${{ gitea.server }}
  IMAGE_NAME: ${{ gitea.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Gitea Actions 需要容器模式运行器（act_runner 配置 docker 模式）

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD }}   # 用 Gitea 个人访问令牌（pat）

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # tag 推送 → 用版本号，如 v1.2.0
            type=semver,pattern={{version}}
            # main 分支 → latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 短 commit sha，便于追溯
            type=sha,prefix=,suffix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 构建完成后通过 SSH 在服务器上拉取并重启 ──
      # 需在仓库 Secrets 中配置 SSH_HOST / SSH_USER / SSH_KEY
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/droneImaging
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker rm -f drone-imaging 2>/dev/null
            docker run -d \
              --name drone-imaging \
              --restart unless-stopped \
              -p 8005:8002 \
              -e DRONE_PUBLIC_BASE_URL=http://${{ secrets.SSH_HOST }}:8005 \
              -v ~/droneImaging/config.yaml:/app/config.yaml:ro \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
