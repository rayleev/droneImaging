# Woodpecker CI — droneImaging 流水线
# 在网页上手动触发执行

steps:
  build:
    image: docker:24
    commands:
      - docker build -t drone-imaging:latest .
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  deploy:
    image: docker:24
    commands:
      - echo "DEBUG: CONFIG_YAML length = ${#CONFIG_YAML}"
      - echo "$CONFIG_YAML" > /tmp/config.yaml
      - ls -la /tmp/config.yaml
      - cat /tmp/config.yaml
      - docker stop drone-imaging 2>/dev/null || true
      - docker rm -f drone-imaging 2>/dev/null || true
      - >
        docker run -d
        --name drone-imaging
        --restart unless-stopped
        -p 8005:8002
        -e DRONE_PUBLIC_BASE_URL=http://10.33.105.145:8005
        -v /tmp/config.yaml:/app/config.yaml:ro
        drone-imaging:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CONFIG_YAML:
        from_secret: CONFIG_YAML
