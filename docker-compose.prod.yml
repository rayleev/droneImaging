# droneImaging — 生产部署（仅本服务）
#
# 前提：PostgreSQL / MinIO / Milvus 已在服务器的 Docker 中运行。
# 本 compose 只启动 drone-imaging，通过已有网络接入依赖。
#
# 使用方式：
#   1. 修改下方 environment 中的连接信息，匹配你现有服务的实际地址/密码
#   2. 修改 networks 中的 external name，为你现有服务所在的 Docker 网络名
#      （通过 `docker network ls` 查看，通常是已有 compose 的目录名_default）
#   3. docker compose -f docker-compose.prod.yml up -d
#
# 构建镜像（可选，也可用 CI/CD 构建）：
#   docker compose -f docker-compose.prod.yml build

services:
  drone-imaging:
    build:
      context: .
      dockerfile: Dockerfile
    image: drone-imaging:latest
    container_name: drone-imaging
    restart: unless-stopped
    environment:
      # ── 对外 URL（内网访问地址）──
      DRONE_PUBLIC_BASE_URL: http://10.0.0.1:8002   # 改成服务器内网 IP

      # ── 数据库连接（覆盖 config.yaml，优先级更高）──
      # 如果依赖和本服务在同一 Docker 网络，用容器名访问；否则用宿主机 IP
      DB_URL: postgresql+asyncpg://postgres:Admin123!@drone-postgres:5432/drone_imaging
      MINIO_ENDPOINT: drone-minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MILVUS_HOST: drone-milvus
      MILVUS_PORT: "19530"

      # ── 外部 API ──
      VLM_API_KEY: your-dashscope-api-key
      EMBEDDING_API_URL: http://10.0.0.1:18011/graph/v1/vector/embed  # 内网 embedding 服务
      EMBEDDING_API_KEY: your-embedding-api-key
    ports:
      - "8002:8002"
    volumes:
      # 挂载日志目录（可选，方便宿主机查看日志）
      - ./logs:/app/logs
    networks:
      - drone-net    # 接入已有网络
    deploy:
      resources:
        limits:
          # 单张影像 700-800MB，处理时需要内存，限制 4GB 防 OOM 拖垮宿主机
          memory: 4G

networks:
  drone-net:
    external: true      # 使用已有网络，需替换为实际网络名
    # name: your_existing_network_name   # 取消注释并填写实际网络名
