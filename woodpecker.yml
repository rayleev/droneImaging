# Woodpecker CI — droneImaging 流水线
# 在网页上手动触发执行
#
# 流程: build → deploy（停旧 → 起新 → 健康检查 → 失败回滚）
#
# 网络:
#   infra         → 共享基础设施（postgres、minio、milvus 等）
#   phenomics-net → 与 phenomics-backend 通信
#
# 健康检查用独立 curl 容器接入 phenomics-net，通过容器名访问。

steps:
  - name: build
    image: docker:24
    commands:
      - docker build -t drone-imaging:latest .
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  - name: deploy
    image: docker:24
    commands:
      - |
        set -e

        # ── 1. 写入配置 ──
        DEPLOY_CFG=/home/root01/deploy/drone-imaging/config.yaml
        rm -rf "$DEPLOY_CFG"
        echo "$CONFIG_YAML" > "$DEPLOY_CFG"
        echo "配置已写入 $DEPLOY_CFG"

        # ── 2. 确保网络存在 ──
        docker network inspect infra >/dev/null 2>&1 || docker network create infra
        docker network inspect phenomics-net >/dev/null 2>&1 || docker network create phenomics-net

        # ── 3. 记录旧镜像（用于回滚）──
        OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' drone-imaging 2>/dev/null) || OLD_IMAGE=""
        echo "旧镜像: ${OLD_IMAGE:-无}"

        # ── 4. 停旧容器 ──
        docker stop drone-imaging 2>/dev/null || true
        docker rm -f drone-imaging 2>/dev/null || true
        echo "旧容器已清理"

        # ── 5. 启动新容器（加入 infra + phenomics-net）──
        # infra 网络: 访问 postgres/minio/milvus 等基础设施（用容器名）
        # phenomics-net: 供 phenomics-frontend nginx 反向代理访问
        docker run -d \
          --name drone-imaging \
          --network infra \
          --network phenomics-net \
          --restart unless-stopped \
          -p 8005:8002 \
          -e DRONE_PUBLIC_BASE_URL=http://10.33.105.145:8005 \
          -v "$DEPLOY_CFG:/app/config.yaml:ro" \
          drone-imaging:latest
        echo "新容器已启动"

        # ── 6. 健康检查（最多 60s）──
        echo "等待服务就绪..."
        for i in $(seq 1 20); do
          if docker run --rm --network phenomics-net curlimages/curl -fsS --max-time 2 http://drone-imaging:8002/health > /dev/null 2>&1; then
            echo "✓ 部署成功，服务就绪"
            exit 0
          fi
          echo "等待中... ($i/20)"
          sleep 3
        done

        # ── 7. 健康检查失败 → 回滚 ──
        echo "✗ 新容器未就绪，执行回滚..."
        docker stop drone-imaging 2>/dev/null || true
        docker rm -f drone-imaging 2>/dev/null || true
        if [ -n "$OLD_IMAGE" ]; then
          docker run -d \
            --name drone-imaging \
            --network infra \
            --network phenomics-net \
            --restart unless-stopped \
            -p 8005:8002 \
            -e DRONE_PUBLIC_BASE_URL=http://10.33.105.145:8005 \
            -v "$DEPLOY_CFG:/app/config.yaml:ro" \
            $OLD_IMAGE
          echo "已回滚到旧镜像: $OLD_IMAGE"
        else
          echo "无旧镜像可回滚"
        fi
        exit 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/root01/deploy:/home/root01/deploy
    environment:
      CONFIG_YAML:
        from_secret: CONFIG_YAML
